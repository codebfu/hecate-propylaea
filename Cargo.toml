[workspace]
resolver = "2"
members = ["crates/proxy"]
default-members = ["crates/proxy"]

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
authors = ["Gaultier HUBERT"]

[workspace.dependencies]
hecate-protocol = { git = "https://github.com/codebfu/hecate.git", rev = "581e2838faddf8e0d3a39f0274af9f1ddd2d6f97", package = "hecate-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
