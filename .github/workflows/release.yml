name: Release (Docker)

on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/codebfu/hecate-propylaea
  hecate-repo: codebfu/hecate

jobs:
  docker:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout propylaea
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          path: hecate-propylaea

      - name: Resolve hecate protocol rev
        id: hecate_rev
        working-directory: hecate-propylaea
        run: |
          rev=$(grep -oP 'rev = "\K[^"]+' Cargo.toml | head -1)
          if [ -z "${rev}" ]; then
            echo "failed to resolve hecate-protocol git rev from Cargo.toml" >&2
            exit 1
          fi
          echo "rev=${rev}" >> "$GITHUB_OUTPUT"

      - name: Checkout hecate (protocol dependency)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.hecate-repo }}
          ref: ${{ steps.hecate_rev.outputs.rev }}
          path: hecate

      - name: Resolve version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
        env:
          GITHUB_REF_NAME: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Propylaea image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: hecate-propylaea/docker/Dockerfile
          push: true
          build-args: |
            PROPYLAEA_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
